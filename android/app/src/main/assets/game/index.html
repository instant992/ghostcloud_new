<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FoxRail Runner</title>
<style>
  html,body{margin:0;padding:0;background:#0F0B1E;overflow:hidden;height:100%;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    touch-action:none;overscroll-behavior:none;}
  #c{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   FoxRail Runner — прототип бесконечного раннера (canvas 2D)
   Лиса GhostCloud бежит по рельсам депо: 3 полосы, поезда с
   крышами, прыжок/подкат, монеты, бонусы, инспектор.
   Мост в RN: window.ReactNativeWebView.postMessage(JSON)
   ══════════════════════════════════════════════════════════════ */

// ── параметры из URL (?theme=dark|light) ──
const Q = new URLSearchParams(location.search);
const THEME = (Q.get("theme") === "light") ? "light" : "dark";

// ── логическое разрешение ──
const W = 540, H = 960;
const cv = document.getElementById("c");
const cx = cv.getContext("2d");

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  cv.width  = Math.round(W * s * Math.min(window.devicePixelRatio||1, 2));
  cv.height = Math.round(H * s * Math.min(window.devicePixelRatio||1, 2));
  cv.style.width  = Math.round(W * s) + "px";
  cv.style.height = Math.round(H * s) + "px";
  SCALE = s;
}
let SCALE = 1;
window.addEventListener("resize", resize); resize();

// ── мост в React Native ──
function rn(msg){
  try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(msg)); }
  catch(e){}
}

// ── константы мира ──
const HORIZON = 300, GROUND = 800;      // y горизонта и плоскости игрока
const LANE_X = [-140, 0, 140];           // смещения полос на плоскости игрока
const Z_FAR = 110;                       // дальность спавна (ед. мира)
const BASE_SPEED = 5.2, MAX_SPEED = 14;  // ед/с
const JUMP_V = 15.5, GRAV = 42;          // прыжок (ед/с, ед/с²)
const ROOF_H = 92;                       // высота крыши поезда
const PLAYER_H = 84, SLIDE_H = 38;
const REWARD_COINS = 75;

const PALETTE = THEME === "light" ? {
  sky1:"#BFE3FF", sky2:"#EAF6FF", ground:"#C9C2D8", rail:"#8A83A0", tie:"#7A6E8F",
  bld:"rgba(120,110,160,0.35)", text:"#241B3A", sub:"#5A5270", panel:"rgba(255,255,255,0.92)",
  panelBorder:"#D8D0EA", accent:"#A855F7", night:false
} : {
  sky1:"#160F2E", sky2:"#3A1B52", ground:"#241B3D", rail:"#6E5FA0", tie:"#3D3358",
  bld:"rgba(90,70,150,0.5)", text:"#F2EEFA", sub:"#B3A8CC", panel:"rgba(24,16,45,0.94)",
  panelBorder:"#4A3A72", accent:"#A855F7", night:true
};
const PINK = "#e0306e", GOLD = "#FFD700", GOLD_D = "#E08A00";

// ── звук (процедурный WebAudio, без файлов) ──
let AC = null, soundOn = true;
function audioInit(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function blip(f0, f1, dur, type, vol){
  if(!AC || !soundOn) return;
  try{
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f0, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), AC.currentTime + dur);
    g.gain.setValueAtTime(vol||0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur + 0.02);
  }catch(e){}
}
const sfx = {
  coin(){ blip(880, 1320, 0.09, "sine", 0.10); },
  jump(){ blip(300, 620, 0.14, "sine", 0.10); },
  slide(){ blip(500, 180, 0.12, "triangle", 0.08); },
  hit(){ blip(220, 55, 0.35, "sawtooth", 0.16); },
  power(){ blip(520, 1040, 0.12, "square", 0.06); setTimeout(()=>blip(780,1560,0.12,"square",0.06),90); },
  land(){ blip(160, 90, 0.07, "triangle", 0.07); },
  swipe(){ blip(400, 700, 0.05, "sine", 0.04); },
};

// ── персистентность прототипа (локально, без сервера) ──
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("foxrun_"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("foxrun_"+k, JSON.stringify(v)); }catch(e){} }
};

// ── состояние игры ──
const S = { MENU:0, PLAY:1, PAUSE:2, DYING:3, RESULT:4 };
let state = S.MENU;
let G = null;          // объект забега
let best = LS.get("best", {coins:0, dist:0});
let wallet = LS.get("wallet", 0);
let runs = LS.get("runs", 0);

function newGame(){
  return {
    dist: 0, coins: 0, combo: 0, lastCoinT: 0,
    speed: BASE_SPEED,
    player: { lane:1, x:0, y:0, vy:0, sliding:false, slideT:0, onRoof:null,
              jumpPow:JUMP_V, dead:false },
    objs: [],            // препятствия/монеты/бонусы
    particles: [],
    floats: [],          // всплывающие тексты
    powers: { magnet:0, jetpack:0, x2:0, skate:0, sneak:0 },
    powerupsUsed: [],
    inspector: { lunge:0 },
    shake: 0, flash: 0,
    spawnZ: 60,          // следующий спавн (дистанция вперёд)
    chunkIdx: 0,
    time: 0, startedAt: Date.now(),
    events: [],          // случайные события
    fogT: 0, goldT: 0, rainT: 0,
    fps: 60, fpsAcc: 0, fpsN: 0, lowPerf: false,
  };
}

// ── спавнер: куски трассы ──
function spawnChunk(){
  const g = G;
  const diff = Math.min(1, g.dist / 4000);          // 0..1 сложность
  const z = Z_FAR + 10;
  const r = Math.random();
  const lane3 = [0,1,2];
  const pick = () => lane3[(Math.random()*3)|0];

  // гарантированная проходимость: не закрываем все 3 полосы
  if (r < 0.26){
    // поезд (стоит или движется) + монеты на крыше
    const lane = pick();
    const cars = 2 + ((Math.random()*2)|0);
    const moving = Math.random() < 0.25 + diff*0.15;
    g.objs.push({ kind:"train", lane, z, cars, len:cars*26,
                  vz: moving ? (Math.random()<0.5 ? 3.2 : -2.2) : 0,
                  color: ["#7C4DBE","#B34FA0","#4A6FD4"][(Math.random()*3)|0] });
    if (Math.random() < 0.7){
      for (let i=0;i<cars*2;i++)
        g.objs.push({ kind:"coin", lane, z: z + 6 + i*4.2, y: ROOF_H + 34 });
    }
  } else if (r < 0.44){
    // барьеры (прыжок) в 1-2 полосах
    const n = Math.random() < 0.35 + diff*0.3 ? 2 : 1;
    const lanes = shuffle(lane3).slice(0, n);
    for (const l of lanes) g.objs.push({ kind:"barrier", lane:l, z });
    // монеты дугой над барьером
    const cl = lanes[0];
    for (let i=0;i<5;i++)
      g.objs.push({ kind:"coin", lane:cl, z: z - 6 + i*3, y: 30 + Math.sin(i/4*Math.PI)*70 });
  } else if (r < 0.58){
    // ворота (подкат)
    const l = pick();
    g.objs.push({ kind:"gate", lane:l, z });
    for (let i=0;i<4;i++) g.objs.push({ kind:"coin", lane:l, z: z - 4 + i*3.4, y: 14 });
  } else if (r < 0.78){
    // линия/зигзаг монет
    let l = pick();
    const n = 6 + ((Math.random()*6)|0);
    for (let i=0;i<n;i++){
      if (i % 3 === 0 && Math.random()<0.4) l = clamp(l + (Math.random()<0.5?-1:1), 0, 2);
      g.objs.push({ kind:"coin", lane:l, z: z + i*3.6, y: 30 });
    }
  } else if (r < 0.86){
    // бонус
    const kinds = ["magnet","jetpack","x2","skate","sneak"];
    const k = kinds[(Math.random()*kinds.length)|0];
    const l = pick();
    g.objs.push({ kind:"power", power:k, lane:l, z, y: 46 });
    for (let i=0;i<3;i++) g.objs.push({ kind:"coin", lane:l, z: z - 6 - i*3.6, y: 30 });
  } else {
    // смешанный: барьер + поезд в разных полосах
    const l1 = pick(); let l2 = clamp(l1 + (Math.random()<0.5?-1:1)*(Math.random()<0.5?1:2), 0, 2);
    if (l2 === l1) l2 = clamp(l1+1,0,2);
    g.objs.push({ kind:"barrier", lane:l1, z });
    g.objs.push({ kind:"train", lane:l2, z: z+8, cars:1+((Math.random()*2)|0), len:0, vz:0,
                  color:["#7C4DBE","#B34FA0","#4A6FD4"][(Math.random()*3)|0] });
    g.objs[g.objs.length-1].len = g.objs[g.objs.length-1].cars*26;
    for (let i=0;i<4;i++) g.objs.push({ kind:"coin", lane: 3-l1-l2 >=0 && 3-l1-l2<=2 ? 3-l1-l2 : l1, z: z + i*3.4, y: 30 });
  }
}
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} return b; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

// ── проекция псевдо-3D ──
function project(t){ // t: 0=горизонт, 1=плоскость игрока
  const p = Math.pow(clamp(t,0,1.25), 1.55);
  return { p, scale: 0.16 + 0.9*p, y: HORIZON + (GROUND-HORIZON)*p };
}
function tOf(z){ return 1 - z / Z_FAR; }

// ── ввод: свайпы + клавиатура ──
let tX=0, tY=0, tT=0, touchId=null;
cv.addEventListener("touchstart", e=>{
  audioInit();
  const t = e.changedTouches[0]; touchId = t.identifier;
  tX=t.clientX; tY=t.clientY; tT=performance.now();
  e.preventDefault();
}, {passive:false});
cv.addEventListener("touchend", e=>{
  const t = [...e.changedTouches].find(x=>x.identifier===touchId);
  if(!t) return;
  const dx = t.clientX-tX, dy = t.clientY-tY, dt = performance.now()-tT;
  handleGesture(dx, dy, dt, t.clientX, t.clientY);
  e.preventDefault();
}, {passive:false});
cv.addEventListener("mousedown", e=>{ audioInit(); tX=e.clientX; tY=e.clientY; tT=performance.now(); });
cv.addEventListener("mouseup", e=>{
  handleGesture(e.clientX-tX, e.clientY-tY, performance.now()-tT, e.clientX, e.clientY);
});
window.addEventListener("keydown", e=>{
  audioInit();
  if (state===S.PLAY){
    if (e.key==="ArrowLeft"||e.key==="a") moveLane(-1);
    else if (e.key==="ArrowRight"||e.key==="d") moveLane(1);
    else if (e.key==="ArrowUp"||e.key==="w") jump();
    else if (e.key==="ArrowDown"||e.key==="s") slide();
    else if (e.key===" "||e.key==="Escape") togglePause();
  } else if (state===S.MENU && (e.key===" "||e.key==="Enter")) startRun();
  else if (state===S.RESULT && (e.key===" "||e.key==="Enter")) startRun();
  else if (state===S.PAUSE && (e.key===" "||e.key==="Escape")) togglePause();
});

function uiPoint(clientX, clientY){ // клиентские → логические координаты
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) / (r.width/W), y: (clientY - r.top) / (r.height/H) };
}
function handleGesture(dx, dy, dt, clientX, clientY){
  const pnt = uiPoint(clientX, clientY);
  const adx = Math.abs(dx), ady = Math.abs(dy);

  // короткие тапы по кнопкам
  if (Math.max(adx,ady) < 22){
    if (state===S.PLAY){
      if (inRect(pnt, BTN.pause)) { togglePause(); return; }
      return;
    }
    if (state===S.MENU){ if (inRect(pnt, BTN.play)) startRun(); else if (inRect(pnt,BTN.sound)) { soundOn=!soundOn; LS.set("sound",soundOn); } return; }
    if (state===S.PAUSE){ if (inRect(pnt,BTN.resume)) togglePause(); else if (inRect(pnt,BTN.quit)) quitRun(); else if (inRect(pnt,BTN.restart)) startRun(); return; }
    if (state===S.RESULT){ if (inRect(pnt,BTN.again)) startRun(); else if (inRect(pnt,BTN.menu)) state=S.MENU; return; }
    return;
  }
  if (state!==S.PLAY) return;
  if (dt > 600) return;
  if (adx > ady){ moveLane(dx>0?1:-1); }
  else { if (dy<0) jump(); else slide(); }
}
const BTN = {
  play:{x:W/2-130,y:640,w:260,h:76}, sound:{x:W-70,y:20,w:50,h:50},
  pause:{x:W-74,y:16,w:58,h:58},
  resume:{x:W/2-130,y:430,w:260,h:64}, restart:{x:W/2-130,y:510,w:260,h:64}, quit:{x:W/2-130,y:590,w:260,h:64},
  again:{x:W/2-140,y:640,w:130,h:66}, menu:{x:W/2+10,y:640,w:130,h:66},
};
function inRect(p,r){ return p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h; }

// ── действия игрока ──
function moveLane(d){
  const pl = G.player;
  const nl = clamp(pl.lane + d, 0, 2);
  if (nl !== pl.lane){ pl.lane = nl; sfx.swipe(); }
}
function jump(){
  const pl = G.player;
  if (pl.sliding){ pl.sliding=false; pl.slideT=0; }
  if (pl.y <= (pl.onRoof? ROOF_H : 0) + 0.5){
    pl.vy = pl.jumpPow; pl.onRoof = null; sfx.jump();
  }
}
function slide(){
  const pl = G.player;
  if (pl.y > (pl.onRoof? ROOF_H:0) + 4){ pl.vy = Math.min(pl.vy, -14); return; } // быстрое падение
  if (!pl.sliding){ pl.sliding = true; pl.slideT = 0.55; sfx.slide(); }
}
function togglePause(){
  if (state===S.PLAY){ state=S.PAUSE; }
  else if (state===S.PAUSE){ state=S.PLAY; lastT=performance.now(); }
}
function startRun(){
  G = newGame();
  state = S.PLAY;
  lastT = performance.now();
  rn({type:"run_start"});
}
function quitRun(){
  // выход из забега = отправка результата
  finishRun(true);
}

// ── завершение забега ──
let resultInfo = null;
function finishRun(quit){
  const g = G;
  const durMs = Date.now() - g.startedAt;
  wallet += g.coins; runs += 1;
  LS.set("wallet", wallet); LS.set("runs", runs);
  if (g.coins > best.coins) best.coins = g.coins;
  if (g.dist > best.dist) best.dist = Math.floor(g.dist);
  LS.set("best", best);
  resultInfo = {
    coins: g.coins, dist: Math.floor(g.dist), durMs,
    reward: g.coins >= REWARD_COINS, quit: !!quit,
    powers: g.powerupsUsed.slice(),
  };
  state = S.RESULT;
  rn({ type:"gameover", coins:g.coins, distance:Math.floor(g.dist),
       duration_ms:durMs, powerups_used:g.powerupsUsed.slice() });
}

function die(){
  const pl = G.player;
  if (G.powers.skate > 0){
    // скейт спасает
    G.powers.skate = 0;
    pl.vy = 12; pl.y = Math.max(pl.y, 4);
    G.shake = 14; G.floats.push({x:W/2, y:GROUND-220, text:"СКЕЙТ СПАС!", c:PINK, t:1.2});
    sfx.power();
    return;
  }
  if (pl.dead) return;
  pl.dead = true;
  G.shake = 22; G.flash = 0.5;
  sfx.hit();
  state = S.DYING;
  G.inspector.lunge = 0;
  if (navigator.vibrate) navigator.vibrate(120);
}

// ── обновление мира ──
let lastT = performance.now();
function update(dt){
  const g = G;
  g.time += dt;
  g.speed = Math.min(MAX_SPEED, BASE_SPEED + g.dist/1500);
  const dz = g.speed * dt * 8;      // ед. мира за кадр
  g.dist += g.speed * dt * 2.2;      // «метры»

  const pl = g.player;

  // таймеры бонусов
  for (const k of ["magnet","jetpack","x2","skate","sneak"])
    if (g.powers[k] > 0) g.powers[k] = Math.max(0, g.powers[k] - dt);
  pl.jumpPow = g.powers.sneak > 0 ? JUMP_V*1.55 : JUMP_V;

  // джетпак: плавный подъём
  if (g.powers.jetpack > 0){
    pl.vy = 0;
    pl.y += (230 - pl.y) * Math.min(1, dt*6);
    pl.onRoof = null;
    if (!g.powerupsUsed.includes("jetpack_active")) g.powerupsUsed.push("jetpack_active");
  }

  // физика прыжка
  if (g.powers.jetpack <= 0){
    pl.vy -= GRAV * dt * 2.4;
    pl.y += pl.vy * dt * 6;
    // поверхность: крыша поезда под игроком или земля
    let surface = 0, roofTrain = null;
    for (const o of g.objs){
      if (o.kind !== "train") continue;
      if (o.lane !== pl.lane) continue;
      if (o.z <= 1.5 && o.z + o.len >= -2){ roofTrain = o; surface = ROOF_H; break; }
    }
    if (pl.y <= surface){
      if (pl.vy < -6){ sfx.land(); g.particles.push(...sparks(pl.x||0, GROUND-6, 5, "#8A7FB0")); }
      pl.y = surface; pl.vy = 0; pl.onRoof = roofTrain;
    } else if (pl.y > surface + 2){
      pl.onRoof = null;
    }
    if (pl.y < 0){ pl.y = 0; pl.vy = 0; }
  }

  // подкат
  if (pl.sliding){
    pl.slideT -= dt;
    if (pl.slideT <= 0) pl.sliding = false;
  }

  // плавное перемещение между полосами
  const targetX = LANE_X[pl.lane];
  pl.x += (targetX - pl.x) * Math.min(1, dt*14);

  // объекты мира
  for (const o of g.objs){
    if (o.kind === "train" && o.vz) o.z -= o.vz * dt;
    o.z -= dz * 0.125 * (o.kind==="train" && o.vz<0 ? 1.25 : 1); // лёгкая вариативность
    // магнит притягивает монеты
    if (g.powers.magnet > 0 && o.kind === "coin" && o.z < 30 && o.z > -1){
      o.lane = pl.lane;
      const tgtY = pl.y + 40;
      o.y += (tgtY - o.y) * Math.min(1, dt*8);
    }
  }

  // столкновения / сбор
  const mult = g.powers.x2 > 0 ? 2 : 1;
  for (let i=g.objs.length-1; i>=0; i--){
    const o = g.objs[i];
    if (o.z < -8){ g.objs.splice(i,1); continue; }
    if (o.z > 6) continue;

    if (o.kind === "coin"){
      const sameLane = o.lane === pl.lane;
      const near = Math.abs(o.z) < 3.2;
      const jet = g.powers.jetpack > 0;
      const dy = Math.abs((pl.y + 42) - o.y);
      if (near && (jet ? sameLane || Math.abs(o.z)<1.5 : sameLane) && (dy < 60 || jet)){
        g.coins += mult;
        g.combo++; g.lastCoinT = g.time;
        sfx.coin();
        const pr = project(tOf(0));
        g.floats.push({ x: W/2 + pl.x*pr.scale, y: GROUND - 120 - pl.y*0.5, text:"+"+mult, c:GOLD, t:0.7 });
        if (g.combo>0 && g.combo%10===0){
          g.coins += 2;
          g.floats.push({ x: W/2, y: GROUND-300, text:"КОМБО x"+g.combo+" +2", c:PINK, t:1.0 });
        }
        g.particles.push(...sparks(W/2+pl.x, GROUND-60-pl.y*0.6, 4, GOLD));
        g.objs.splice(i,1);
      }
      continue;
    }
    if (o.kind === "power"){
      if (Math.abs(o.z) < 3 && o.lane === pl.lane){
        const dur = { magnet:8, jetpack:6, x2:10, skate:12, sneak:8 }[o.power];
        g.powers[o.power] = Math.max(g.powers[o.power], dur);
        if (!g.powerupsUsed.includes(o.power)) g.powerupsUsed.push(o.power);
        sfx.power();
        const names = {magnet:"МАГНИТ", jetpack:"ДЖЕТПАК", x2:"×2 МОНЕТЫ", skate:"СКЕЙТ", sneak:"КРОССОВКИ"};
        g.floats.push({ x:W/2, y:GROUND-330, text:names[o.power]+"!", c:PALETTE.accent, t:1.1 });
        g.objs.splice(i,1);
      }
      continue;
    }
    // препятствия
    if (o.lane !== pl.lane){
      // near-miss
      if (!o._nm && Math.abs(o.z) < 1.2 && Math.abs(o.lane-pl.lane)===1 && (o.kind==="train"||o.kind==="barrier")){
        o._nm = true;
        if (Math.random()<0.5){ g.coins += mult; g.floats.push({x:W/2+pl.x, y:GROUND-200, text:"впритирку +1", c:"#9AE6B4", t:0.8}); }
      }
      continue;
    }
    if (g.powers.jetpack > 0) continue;
    const ph = pl.sliding ? SLIDE_H : PLAYER_H;
    const py0 = pl.y, py1 = pl.y + ph;

    if (o.kind === "barrier"){
      if (o.z < 2 && o.z > -3 && py0 < 44){ die(); return; }
    } else if (o.kind === "gate"){
      if (o.z < 2 && o.z > -3 && py1 > 40 && py0 < 96){ die(); return; }
    } else if (o.kind === "train"){
      if (o.z <= 2.2 && o.z + o.len >= -2){
        if (py1 > ROOF_H - 6 && py0 < ROOF_H){
          // врезался в борт
          die(); return;
        }
      }
    }
  }

  // комбо сбрасывается
  if (g.combo > 0 && g.time - g.lastCoinT > 1.4) g.combo = 0;

  // случайные события после 300 м
  if (g.dist > 300 && Math.random() < dt*0.03){
    const ev = ["gold","fog","rain"][(Math.random()*3)|0];
    if (ev==="gold"){ g.goldT = 8; g.floats.push({x:W/2,y:GROUND-340,text:"ЗОЛОТОЙ ПОЕЗД!",c:GOLD,t:1.4}); }
    if (ev==="fog"){ g.fogT = 7; }
    if (ev==="rain"){ g.rainT = 15; g.floats.push({x:W/2,y:GROUND-340,text:"МОНЕТНЫЙ ДОЖДЬ!",c:GOLD,t:1.4}); }
  }
  for (const k of ["goldT","fogT","rainT"]) if (g[k]>0) g[k]-=dt;

  // частицы/тексты
  for (let i=g.particles.length-1;i>=0;i--){
    const p = g.particles[i];
    p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vy+=0.25; p.t-=dt;
    if (p.t<=0) g.particles.splice(i,1);
  }
  for (let i=g.floats.length-1;i>=0;i--){
    const f = g.floats[i]; f.y -= 40*dt; f.t -= dt;
    if (f.t<=0) g.floats.splice(i,1);
  }
  if (g.shake>0) g.shake = Math.max(0, g.shake - dt*40);
  if (g.flash>0) g.flash = Math.max(0, g.flash - dt*1.4);

  // спавн чанков (с учётом монетного дождя — плотнее)
  const step = g.rainT>0 ? 26 : 42 - diff01()*10;
  g.spawnZ -= dz*0.125;
  if (g.spawnZ <= 0){ spawnChunk(); g.spawnZ += step; g.chunkIdx++; }

  // fps-деградация
  g.fpsAcc += 1/Math.max(dt,0.001); g.fpsN++;
  if (g.fpsN >= 60){
    g.fps = g.fpsAcc/g.fpsN; g.fpsAcc=0; g.fpsN=0;
    if (g.fps < 45) g.lowPerf = true;
  }
}
function diff01(){ return Math.min(1, G.dist/4000); }
function sparks(x,y,n,c){
  if (G.lowPerf) return [];
  const out=[];
  for(let i=0;i<n;i++) out.push({x,y,vx:(Math.random()-0.5)*3,vy:-Math.random()*2.5,t:0.5,c});
  return out;
}

// ── отрисовка ──
function draw(){
  cx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  const g = G;
  const shk = g && g.shake>0 ? g.shake : 0;
  cx.save();
  if (shk>0) cx.translate((Math.random()-0.5)*shk, (Math.random()-0.5)*shk);

  drawSky();
  if (state===S.MENU){ drawMenuScene(); cx.restore(); return; }

  drawGround();
  drawTracks();

  // объекты по удалённости (дальние первыми)
  const sorted = g.objs.slice().sort((a,b)=> b.z - a.z);
  for (const o of sorted) drawObj(o);

  drawPlayer();
  drawInspector();
  drawParticles();
  drawFloats();
  drawFog();
  drawHUD();

  if (g.flash>0){ cx.fillStyle = "rgba(255,60,60,"+(g.flash*0.4)+")"; cx.fillRect(0,0,W,H); }
  cx.restore();

  if (state===S.PAUSE) drawPause();
  if (state===S.RESULT) drawResult();
}

function drawSky(){
  const gr = cx.createLinearGradient(0,0,0,HORIZON+80);
  gr.addColorStop(0, PALETTE.sky1); gr.addColorStop(1, PALETTE.sky2);
  cx.fillStyle = gr; cx.fillRect(0,0,W,HORIZON+80);
  // луна/солнце
  if (PALETTE.night){
    cx.fillStyle = "rgba(255,255,240,0.9)";
    cx.beginPath(); cx.arc(440, 90, 26, 0, Math.PI*2); cx.fill();
    cx.fillStyle = PALETTE.sky1;
    cx.beginPath(); cx.arc(450, 84, 22, 0, Math.PI*2); cx.fill();
  }
  // силуэты зданий (параллакс по дистанции)
  const off = G ? (G.dist*0.6)%180 : 0;
  cx.fillStyle = PALETTE.bld;
  for (let i=-1;i<5;i++){
    const bx = i*180 - off;
    cx.fillRect(bx, 130, 60, 170);
    cx.fillRect(bx+70, 90, 46, 210);
    cx.fillRect(bx+126, 160, 40, 140);
  }
}

function drawGround(){
  cx.fillStyle = PALETTE.ground;
  cx.fillRect(0, HORIZON, W, H-HORIZON);
}

function drawTracks(){
  // три пути с перспективой: линии рельсов сходятся к горизонту
  const g = G;
  const tieOff = g ? (g.dist*17)%48 : 0;
  for (let i=0;i<26;i++){
    const t = i/25;
    const pr = project(t);
    // шпалы
    const tieY = pr.y;
    const halfW = 250*pr.p + 60*pr.p;
    if ((i*48 + tieOff*3) % 96 < 48 || true){
      cx.fillStyle = PALETTE.tie;
      const th = Math.max(2, 12*pr.scale);
      const yy = HORIZON + (GROUND-HORIZON)*Math.pow(((i*48+tieOff)/1250)%1, 1.55);
      if (yy > HORIZON && yy < GROUND+40){
        const p2 = project(Math.pow((yy-HORIZON)/(GROUND-HORIZON), 1/1.55));
        const w = 460*p2.p;
        cx.fillRect(W/2 - w/2, yy, w, th*p2.scale+2);
      }
    }
  }
  // рельсы (4 пары линий — границы полос)
  cx.strokeStyle = PALETTE.rail; cx.lineWidth = 3;
  for (const lx of [-210,-70,70,210]){
    cx.beginPath();
    cx.moveTo(W/2, HORIZON);
    cx.lineTo(W/2 + lx*1.05, GROUND+60);
    cx.stroke();
  }
}

function laneScreenX(lane, p){ return W/2 + LANE_X[lane]*p*1.05; }

function drawObj(o){
  const t = tOf(o.z);
  if (t < -0.05 || t > 1.3) return;
  const pr = project(t);
  const sx = laneScreenX(o.lane, pr.p);
  const s = pr.scale;

  if (o.kind === "coin"){
    const y = pr.y - (o.y||30)*s;
    const r = 15*s;
    const wob = Math.abs(Math.sin(G.time*5 + o.z));
    cx.save(); cx.translate(sx, y); cx.scale(Math.max(0.2,wob), 1);
    cx.fillStyle = GOLD; cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2); cx.fill();
    cx.fillStyle = GOLD_D; cx.beginPath(); cx.arc(0,0,r*0.62,0,Math.PI*2); cx.fill();
    cx.fillStyle = GOLD;
    // молния GhostCloud
    cx.beginPath();
    cx.moveTo(-r*0.18,-r*0.42); cx.lineTo(r*0.22,-r*0.06); cx.lineTo(0,-r*0.02);
    cx.lineTo(r*0.18,r*0.42); cx.lineTo(-r*0.22,r*0.06); cx.lineTo(0,r*0.02);
    cx.closePath(); cx.fill();
    cx.restore();
    return;
  }

  if (o.kind === "power"){
    const y = pr.y - (o.y||46)*s - Math.sin(G.time*3+o.z)*4*s;
    const r = 21*s;
    cx.save(); cx.translate(sx, y);
    const cols = {magnet:"#FF6B6B", jetpack:"#FFA94D", x2:GOLD, skate:"#4DD0FF", sneak:"#B197FC"};
    const icons = {magnet:"U", jetpack:"↑", x2:"×2", skate:"▬", sneak:"»"};
    cx.shadowColor = cols[o.power]; cx.shadowBlur = G.lowPerf?0:14*s;
    cx.fillStyle = "rgba(15,11,30,0.85)";
    cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2); cx.fill();
    cx.strokeStyle = cols[o.power]; cx.lineWidth = 3*s;
    cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2); cx.stroke();
    cx.shadowBlur = 0;
    cx.fillStyle = cols[o.power];
    cx.font = "bold "+Math.round(18*s)+"px sans-serif";
    cx.textAlign="center"; cx.textBaseline="middle";
    cx.fillText(icons[o.power], 0, 1*s);
    cx.restore();
    return;
  }

  if (o.kind === "barrier"){
    const h = 46*s, w = 110*s;
    cx.fillStyle = "#C0392B";
    cx.fillRect(sx-w/2, pr.y-h, w, h*0.62);
    cx.fillStyle = "#F1C40F";
    for (let i=0;i<4;i++) cx.fillRect(sx-w/2+i*(w/4), pr.y-h, w/8, h*0.62);
    cx.fillStyle = "#7B241C";
    cx.fillRect(sx-w/2, pr.y-h*0.38, w, h*0.38);
    cx.fillStyle = "rgba(255,255,255,0.8)";
    cx.font = "bold "+Math.round(13*s)+"px sans-serif"; cx.textAlign="center";
    cx.fillText("СТОП", sx, pr.y-h*0.12);
    return;
  }

  if (o.kind === "gate"){
    const w = 120*s;
    // верхняя перекладина на опорах — под ней надо подкатиться
    cx.fillStyle = "#8E44AD";
    cx.fillRect(sx-6*s, pr.y-110*s, 12*s, 110*s);
    cx.fillRect(sx+w/2-6*s, pr.y-110*s, 12*s, 110*s);
    cx.fillStyle = "#F39C12";
    cx.fillRect(sx-w/2, pr.y-104*s, w, 46*s);
    cx.fillStyle = "#2C1A4A";
    cx.font = "bold "+Math.round(15*s)+"px sans-serif"; cx.textAlign="center";
    cx.fillText("НЫРЯЙ!", sx, pr.y-76*s);
    return;
  }

  if (o.kind === "train"){
    drawTrain(o, sx, pr, s);
    return;
  }
}

function drawTrain(o, sx, pr, s){
  const g = G;
  const gold = g.goldT > 0 && o._gold;
  // поезд рисуется от хвоста к голове (дальние вагоны раньше)
  const cars = o.cars || 2;
  for (let c=cars-1; c>=0; c--){
    const zc = o.z + c*26;
    const tc = tOf(zc);
    if (tc < -0.05) continue;
    const pc = project(tc);
    const sc = pc.scale;
    const cxp = laneScreenX(o.lane, pc.p);
    const bodyW = 118*sc, bodyH = ROOF_H*sc;
    const carH = 96*sc;
    // тень
    cx.fillStyle = "rgba(0,0,0,0.25)";
    cx.beginPath();
    cx.ellipse(cxp, pc.y+4*sc, bodyW*0.55, 10*sc, 0, 0, Math.PI*2);
    cx.fill();
    // корпус
    const base = gold ? GOLD : o.color;
    cx.fillStyle = base;
    roundRect(cxp-bodyW/2, pc.y-carH, bodyW, carH, 10*sc);
    cx.fill();
    // низ темнее
    cx.fillStyle = "rgba(0,0,0,0.25)";
    cx.fillRect(cxp-bodyW/2, pc.y-18*sc, bodyW, 18*sc);
    // окна
    cx.fillStyle = PALETTE.night ? "rgba(255,236,170,0.92)" : "rgba(190,225,255,0.95)";
    const wn = 3;
    for (let i=0;i<wn;i++){
      const wxx = cxp - bodyW/2 + bodyW*(0.14 + i*0.29);
      roundRect(wxx, pc.y-carH+14*sc, bodyW*0.18, 26*sc, 4*sc); cx.fill();
    }
    // полоса бренда
    cx.fillStyle = "rgba(255,255,255,0.85)";
    cx.fillRect(cxp-bodyW/2, pc.y-carH*0.42, bodyW, 7*sc);
    cx.fillStyle = PALETTE.accent;
    cx.fillRect(cxp-bodyW/2, pc.y-carH*0.42, bodyW*0.4, 7*sc);
    // крыша (ходимая) — светлая площадка
    cx.fillStyle = gold ? "#FFE87A" : "#5C4A8A";
    roundRect(cxp-bodyW/2+4*sc, pc.y-carH-6*sc, bodyW-8*sc, 10*sc, 4*sc); cx.fill();
    // люк на крыше
    cx.fillStyle = "rgba(255,255,255,0.25)";
    cx.fillRect(cxp-14*sc, pc.y-carH-4*sc, 28*sc, 5*sc);
    // фары на ближнем вагоне
    if (c===0 && tc>0.55){
      cx.fillStyle = "#FFF7C0";
      cx.beginPath(); cx.arc(cxp-bodyW*0.3, pc.y-24*sc, 6*sc, 0, Math.PI*2); cx.fill();
      cx.beginPath(); cx.arc(cxp+bodyW*0.3, pc.y-24*sc, 6*sc, 0, Math.PI*2); cx.fill();
    }
  }
}

function roundRect(x,y,w,h,r){
  cx.beginPath();
  cx.moveTo(x+r,y);
  cx.arcTo(x+w,y,x+w,y+h,r);
  cx.arcTo(x+w,y+h,x,y+h,r);
  cx.arcTo(x,y+h,x,y,r);
  cx.arcTo(x,y,x+w,y,r);
  cx.closePath();
}

// ── лиса (canvas-спрайт из примитивов, в бренд-стиле) ──
function drawFox(px, py, s, runPhase, sliding, jumping, dead){
  cx.save();
  cx.translate(px, py);
  cx.scale(s, s);
  if (dead){ cx.rotate(-0.5); }
  const bob = jumping||sliding ? 0 : Math.sin(runPhase)*3;
  // хвост
  cx.fillStyle = "#F28C28";
  cx.beginPath();
  cx.ellipse(-26, -30+bob+ (sliding?14:0), 20, 9, -0.5+Math.sin(runPhase)*0.25, 0, Math.PI*2);
  cx.fill();
  cx.fillStyle = "#FFF3E0";
  cx.beginPath(); cx.ellipse(-40, -36+bob+(sliding?14:0), 8, 5, -0.5, 0, Math.PI*2); cx.fill();

  if (sliding){
    // подкат — компактная поза
    cx.fillStyle = "#F28C28";
    cx.beginPath(); cx.ellipse(0, -16, 34, 15, 0, 0, Math.PI*2); cx.fill();
    cx.fillStyle = "#FFF3E0";
    cx.beginPath(); cx.ellipse(6, -12, 18, 8, 0, 0, Math.PI*2); cx.fill();
    // голова
    drawFoxHead(26, -22, 0.8, runPhase);
  } else {
    // тело
    cx.fillStyle = "#F28C28";
    roundRect(-16, -64+bob, 34, 40, 12); cx.fill();
    cx.fillStyle = "#FFF3E0";
    roundRect(-8, -52+bob, 18, 26, 8); cx.fill();
    // ноги (анимация бега)
    cx.fillStyle = "#D97A1E";
    const lp = jumping ? 0.6 : Math.sin(runPhase);
    roundRect(-12, -26+bob, 9, 24 - (jumping?8:0), 4); cx.fill();
    cx.save(); cx.translate(8, -26+bob); cx.rotate(jumping?-0.6:lp*0.7);
    roundRect(-4, 0, 9, 24-(jumping?8:0), 4); cx.fill(); cx.restore();
    cx.save(); cx.translate(-8, -26+bob); cx.rotate(jumping?0.5:-lp*0.7);
    roundRect(-4, 0, 9, 24-(jumping?8:0), 4); cx.fill(); cx.restore();
    // руки
    cx.fillStyle = "#F28C28";
    cx.save(); cx.translate(-14, -56+bob); cx.rotate(jumping?-1.2:lp*0.8);
    roundRect(-3,0,7,20,3); cx.fill(); cx.restore();
    cx.save(); cx.translate(14, -56+bob); cx.rotate(jumping?-1.9:-lp*0.8);
    roundRect(-3,0,7,20,3); cx.fill(); cx.restore();
    // голова
    drawFoxHead(0, -78+bob, 1, runPhase);
  }
  cx.restore();
}
function drawFoxHead(hx, hy, s, phase){
  cx.save();
  cx.translate(hx, hy); cx.scale(s,s);
  // уши
  cx.fillStyle = "#F28C28";
  cx.beginPath(); cx.moveTo(-16,-8); cx.lineTo(-22,-30); cx.lineTo(-4,-16); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(16,-8); cx.lineTo(22,-30); cx.lineTo(4,-16); cx.closePath(); cx.fill();
  cx.fillStyle = "#C77DFF";
  cx.beginPath(); cx.moveTo(-15,-11); cx.lineTo(-19,-25); cx.lineTo(-8,-16); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(15,-11); cx.lineTo(19,-25); cx.lineTo(8,-16); cx.closePath(); cx.fill();
  // голова
  cx.fillStyle = "#F28C28";
  cx.beginPath(); cx.ellipse(0,0,19,16,0,0,Math.PI*2); cx.fill();
  // мордочка
  cx.fillStyle = "#FFF3E0";
  cx.beginPath(); cx.ellipse(0,6,11,8,0,0,Math.PI*2); cx.fill();
  cx.fillStyle = "#2A1B3D";
  cx.beginPath(); cx.arc(0,3,3,0,Math.PI*2); cx.fill();
  // глаза
  cx.beginPath(); cx.arc(-7,-3,2.6,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(7,-3,2.6,0,Math.PI*2); cx.fill();
  // фиолетовая чёлка (как у персонажа с иконки)
  cx.fillStyle = "#A855F7";
  cx.beginPath();
  cx.moveTo(-17,-6); cx.quadraticCurveTo(-10,-22, 0,-18);
  cx.quadraticCurveTo(12,-24, 17,-6);
  cx.quadraticCurveTo(8,-14, 0,-11);
  cx.quadraticCurveTo(-9,-14, -17,-6);
  cx.closePath(); cx.fill();
  cx.restore();
}

function drawPlayer(){
  const g = G, pl = g.player;
  const pr = project(1);
  const px = W/2 + pl.x*1.05;
  const py = GROUND - pl.y*0.62;
  // тень
  const shScale = clamp(1 - pl.y/260, 0.35, 1);
  cx.fillStyle = "rgba(0,0,0,0.3)";
  cx.beginPath(); cx.ellipse(px, GROUND+6, 34*shScale, 9*shScale, 0,0,Math.PI*2); cx.fill();
  // скейт под ногами
  if (g.powers.skate > 0){
    cx.fillStyle = "#4DD0FF";
    roundRect(px-30, py-4, 60, 9, 4); cx.fill();
    cx.fillStyle = "rgba(255,255,255,0.6)";
    cx.beginPath(); cx.arc(px-18, py+7, 4, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(px+18, py+7, 4, 0, Math.PI*2); cx.fill();
  }
  // джетпак-пламя
  if (g.powers.jetpack > 0){
    cx.fillStyle = "#FFA94D";
    cx.beginPath();
    cx.moveTo(px-10, py-30); cx.lineTo(px, py-2 + Math.random()*10); cx.lineTo(px+10, py-30);
    cx.closePath(); cx.fill();
  }
  const runPhase = g.time*14;
  drawFox(px, py, 1, runPhase, pl.sliding, pl.y>4 || g.powers.jetpack>0, pl.dead);
  // магнит-аура
  if (g.powers.magnet>0 && !g.lowPerf){
    cx.strokeStyle = "rgba(255,107,107,0.4)"; cx.lineWidth=2;
    cx.beginPath(); cx.arc(px, py-40, 52+Math.sin(g.time*6)*4, 0, Math.PI*2); cx.stroke();
  }
  // ×2 аура
  if (g.powers.x2>0 && !g.lowPerf){
    cx.strokeStyle = "rgba(255,215,0,0.45)"; cx.lineWidth=3;
    cx.beginPath(); cx.arc(px, py-40, 44, 0, Math.PI*2); cx.stroke();
  }
}

function drawInspector(){
  const g = G;
  if (state===S.DYING || state===S.RESULT){
    const l = clamp(g.inspector.lunge, 0, 1);
    const py = H + 60 - l*220;
    cx.save();
    cx.translate(W/2 + (G.player.x||0)*0.4, py);
    cx.scale(1.5,1.5);
    // силуэт инспектора: тёмная фигура с фуражкой
    cx.fillStyle = "#1E2A4A";
    roundRect(-26,-70,52,70,14); cx.fill();
    cx.fillStyle = "#F5CBA7";
    cx.beginPath(); cx.arc(0,-84,15,0,Math.PI*2); cx.fill();
    cx.fillStyle = "#17203A";
    roundRect(-19,-98,38,10,4); cx.fill();
    roundRect(-13,-106,26,10,5); cx.fill();
    cx.fillStyle = GOLD;
    cx.beginPath(); cx.arc(0,-101,3.5,0,Math.PI*2); cx.fill();
    cx.restore();
    return;
  }
  // в обычном беге — чуть виден внизу экрана
  const bob = Math.sin(G.time*14)*4;
  cx.save();
  cx.translate(W/2 + (G.player.x||0)*0.3, H+34+bob);
  cx.scale(1.25,1.25);
  cx.fillStyle = "#1E2A4A";
  roundRect(-26,-64,52,64,14); cx.fill();
  cx.fillStyle = "#F5CBA7";
  cx.beginPath(); cx.arc(0,-78,14,0,Math.PI*2); cx.fill();
  cx.fillStyle = "#17203A";
  roundRect(-18,-91,36,9,4); cx.fill();
  roundRect(-12,-99,24,9,5); cx.fill();
  cx.restore();
}

function drawParticles(){
  for (const p of G.particles){
    cx.globalAlpha = clamp(p.t*2,0,1);
    cx.fillStyle = p.c;
    cx.fillRect(p.x-2, p.y-2, 4, 4);
  }
  cx.globalAlpha = 1;
  // линии скорости
  if (!G.lowPerf && G.speed > 10.5){
    cx.strokeStyle = "rgba(255,255,255,0.12)"; cx.lineWidth = 2;
    for (let i=0;i<7;i++){
      const yy = (G.time*900 + i*137) % (GROUND-HORIZON) + HORIZON;
      cx.beginPath(); cx.moveTo(30+i*70, yy); cx.lineTo(30+i*70, yy+30); cx.stroke();
    }
  }
}
function drawFloats(){
  for (const f of G.floats){
    cx.globalAlpha = clamp(f.t,0,1);
    cx.fillStyle = f.c;
    cx.font = "bold 20px sans-serif";
    cx.textAlign = "center";
    cx.fillText(f.text, f.x, f.y);
  }
  cx.globalAlpha = 1;
}
function drawFog(){
  if (G.fogT<=0) return;
  const gr = cx.createLinearGradient(0,HORIZON,0,GROUND);
  gr.addColorStop(0,"rgba(200,200,220,0.5)");
  gr.addColorStop(1,"rgba(200,200,220,0)");
  cx.fillStyle = gr; cx.fillRect(0,HORIZON,W,GROUND-HORIZON);
}

// ── HUD ──
function drawHUD(){
  const g = G;
  // монеты + кольцо прогресса
  const ringX = 56, ringY = 58, ringR = 26;
  cx.fillStyle = "rgba(10,6,22,0.55)";
  cx.beginPath(); cx.arc(ringX, ringY, ringR+7, 0, Math.PI*2); cx.fill();
  cx.strokeStyle = "rgba(255,255,255,0.18)"; cx.lineWidth = 5;
  cx.beginPath(); cx.arc(ringX, ringY, ringR, -Math.PI/2, Math.PI*1.5); cx.stroke();
  const prog = clamp(g.coins / REWARD_COINS, 0, 1);
  cx.strokeStyle = prog>=1 ? "#7CFF9B" : GOLD;
  cx.beginPath(); cx.arc(ringX, ringY, ringR, -Math.PI/2, -Math.PI/2 + Math.PI*2*prog); cx.stroke();
  cx.fillStyle = GOLD;
  cx.beginPath(); cx.arc(ringX, ringY, 9, 0, Math.PI*2); cx.fill();
  cx.fillStyle = "#fff";
  cx.font = "bold 17px sans-serif"; cx.textAlign = "center";
  cx.fillText(g.coins + "/" + REWARD_COINS, ringX, ringY + ringR + 22);
  // дистанция
  cx.textAlign = "right";
  cx.fillStyle = PALETTE.text;
  cx.font = "bold 22px sans-serif";
  cx.fillText(Math.floor(g.dist) + " м", W-24, 100);
  // комбо
  if (g.combo >= 5){
    cx.fillStyle = PINK; cx.font = "bold 16px sans-serif";
    cx.fillText("комбо x"+g.combo, W-24, 126);
  }
  // активные бонусы
  let bx = 20, by = 120;
  const defs = [["magnet","#FF6B6B","U"],["jetpack","#FFA94D","↑"],["x2",GOLD,"×2"],["skate","#4DD0FF","▬"],["sneak","#B197FC","»"]];
  const maxD = { magnet:8, jetpack:6, x2:10, skate:12, sneak:8 };
  for (const [k,c,ic] of defs){
    if (g.powers[k] <= 0) continue;
    cx.fillStyle = "rgba(10,6,22,0.6)";
    roundRect(bx, by, 40, 40, 10); cx.fill();
    cx.strokeStyle = c; cx.lineWidth = 2;
    roundRect(bx, by, 40, 40, 10); cx.stroke();
    cx.fillStyle = c; cx.font = "bold 18px sans-serif"; cx.textAlign="center";
    cx.fillText(ic, bx+20, by+26);
    // полоска времени
    cx.fillStyle = "rgba(255,255,255,0.2)";
    cx.fillRect(bx+4, by+44, 32, 4);
    cx.fillStyle = c;
    cx.fillRect(bx+4, by+44, 32*clamp(g.powers[k]/maxD[k],0,1), 4);
    bx += 50;
  }
  // кнопка паузы
  cx.fillStyle = "rgba(10,6,22,0.55)";
  roundRect(BTN.pause.x, BTN.pause.y, BTN.pause.w, BTN.pause.h, 14); cx.fill();
  cx.fillStyle = "#fff";
  cx.fillRect(BTN.pause.x+19, BTN.pause.y+17, 7, 24);
  cx.fillRect(BTN.pause.x+32, BTN.pause.y+17, 7, 24);
}

  cx.fillRect(0,0,W,H);

function drawResult(){

  // статус награды
  if (r.reward){
    cx.fillStyle = "#7CFF9B"; cx.font = "bold 24px sans-serif";

    cx.fillStyle = PALETTE.sub; cx.font = "15px sans-serif";
    cx.fillText("(в прототипе без сервера — начисление после подключения API)", W/2, 528);
  } else {
    cx.fillStyle = PINK; cx.font = "bold 20px sans-serif";
    cx.fillText("Ещё "+(REWARD_COINS-r.coins)+" монет до награды «+1 день»", W/2, 505);
  }
  cx.fillStyle = PALETTE.sub; cx.font = "15px sans-serif";
  cx.fillText("бонусов использовано: "+(r.powers.filter(p=>!p.endsWith('_active')).join(", ")||"нет"), W/2, 572);
  panelBtn(BTN.again, "ЕЩЁ РАЗ", PALETTE.accent);
  panelBtn(BTN.menu, "В МЕНЮ", "#3D3358");
}

// ── главный цикл ──
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastT)/1000;
  lastT = now;
  if (dt > 0.033) dt = 0.033;

  if (state===S.PLAY){
    // фиксированный шаг физики
    acc += dt;
    while (acc >= 1/60){ update(1/60); acc -= 1/60; if (state!==S.PLAY) break; }
  } else if (state===S.DYING){
    G.inspector.lunge += dt*1.1;
    G.shake = Math.max(0, G.shake - dt*30);
    if (G.inspector.lunge >= 1.15){ finishRun(false); }
  }

  if (G || state===S.MENU) draw();
}
let acc = 0;

// авто-пауза при уходе в фон
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden && state===S.PLAY) state = S.PAUSE;
});

soundOn = LS.get("sound", true);
rn({type:"ready"});
requestAnimationFrame(frame);
</script>
