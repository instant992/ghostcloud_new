plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.xraycore'
version = '1.0.0'

android {
  namespace "expo.modules.xraycore"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation(project(":xraylibs"))
}
